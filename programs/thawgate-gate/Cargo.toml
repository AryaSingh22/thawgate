[package]
name = "thawgate-gate"
version = "0.1.0"
description = "ThawGate: Token ACL (sRFC 37) gating program with issuer blacklist, allowlist and SAS KYC policies"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "thawgate_gate"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
spl-token-2022 = { workspace = true }
spl-tlv-account-resolution = { workspace = true }
spl-discriminator = "0.4.1"
# On-curve check for BypassForPdas: `validate_edwards` is the `sol_curve_validate_point` syscall on SBF, where
# `Pubkey::is_on_curve` is `unimplemented!()`. Same version spl-token-2022 already pulls in (Cargo.lock).
solana-curve25519 = "2.2.20"
# Prevent Edition 2024 transitive upgrades during SBF compile (same pins as transfer-hook)
blake3 = "=1.5.5"
toml_edit = "=0.21.1"
toml_datetime = "=0.6.6"
bytemuck_derive = "=1.8.1"
constant_time_eq = "=0.3.1"
# `custom`: getrandom 0.2 has no SBF backend (pulled in via spl-token-2022 -> solana-zk-sdk). The other programs
# get this feature through workspace unification; `anchor build -p thawgate_gate` builds the gate alone.
getrandom = { version = "=0.2.14", features = ["custom"] }

[dev-dependencies]
# Only for the layout-drift and seed tests against the real registry structs. `idl-build` because the gate's IDL
# build compiles dev-dependencies with anchor-lang/idl-build on, and sss-token's accounts then need anchor-spl's.
sss-token = { path = "../sss-token", features = ["no-entrypoint", "idl-build"] }

[lints]
workspace = true
