[package]
name = "demo-pool"
version = "0.1.0"
description = "Demo venue for ThawGate: a minimal constant-product pool whose init is separate from its deposit"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "demo_pool"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
spl-token-2022 = { workspace = true }
# Prevent Edition 2024 transitive upgrades during SBF compile (same pins as thawgate-gate)
blake3 = "=1.5.5"
toml_edit = "=0.21.1"
toml_datetime = "=0.6.6"
bytemuck_derive = "=1.8.1"
constant_time_eq = "=0.3.1"
# `custom`: getrandom 0.2 has no SBF backend (pulled in via spl-token-2022 -> solana-zk-sdk); see thawgate-gate.
getrandom = { version = "=0.2.14", features = ["custom"] }

[lints]
workspace = true
