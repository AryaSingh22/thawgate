name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit bash runs steps with `-eo pipefail`, so `cmd | tee log` fails when cmd fails
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Same as local dev. There is no 3.0.15 release (the `stable` channel once served an untagged v3.0 build labelled 3.0.15)
  SOLANA_VERSION: "3.0.14"
  ANCHOR_VERSION: "0.32.2"
  # Node 22: commander@15 (via @solana/errors 6.x) requires >= 22.12; local dev runs 22.17
  NODE_VERSION: "22"

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install -o "$RUNNER_TEMP/solana-install.sh"
          sh "$RUNNER_TEMP/solana-install.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Install Anchor CLI
        run: |
          # anchor-cli pulls hidapi (solana-remote-wallet), which links the system libudev
          sudo apt-get update -y && sudo apt-get install -y libudev-dev pkg-config
          cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked

      - name: Run clippy (zero warnings policy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo test-sbf (sss-token)
        run: cargo test-sbf --manifest-path programs/sss-token/Cargo.toml 2>&1 | tee cargo_test_sbf_sss_token.log

      - name: Run cargo test-sbf (transfer-hook)
        run: cargo test-sbf --manifest-path programs/transfer-hook/Cargo.toml 2>&1 | tee cargo_test_sbf_transfer_hook.log

      - name: Upload SBF test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-sbf-logs
          path: |
            cargo_test_sbf_sss_token.log
            cargo_test_sbf_transfer_hook.log

  typescript-checks:
    name: TypeScript Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check (SDK)
        run: |
          yarn workspace @thawgate/sdk run typecheck
          yarn workspace @thawgate/sdk run build

      - name: TypeScript check (CLI)
        run: yarn workspace @thawgate/cli run typecheck

      - name: Run tests
        run: yarn test
