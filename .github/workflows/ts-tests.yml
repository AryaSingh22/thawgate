name: TypeScript Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  # Local dev uses Agave 3.0.15, which has no public release; 3.0.14 is the nearest published 3.0.x
  SOLANA_VERSION: "3.0.14"
  ANCHOR_VERSION: "0.32.2"

jobs:
  ts-tests:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install -o "$RUNNER_TEMP/solana-install.sh"
          sh "$RUNNER_TEMP/solana-install.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Generate test keypair
        run: solana-keygen new --no-bip39-passphrase --outfile ./test-keypair.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Anchor CLI
        run: |
          # anchor-cli pulls hidapi (solana-remote-wallet), which links the system libudev
          sudo apt-get update -y && sudo apt-get install -y libudev-dev pkg-config
          cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked

      - name: Build programs
        run: |
          solana config set --url localhost
          anchor build

      - name: Run unit tests
        env:
          ANCHOR_WALLET: ./test-keypair.json
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
        run: |
          # anchor 0.32 `localnet` waits for a line on stdin and panics on EOF, so keep stdin open
          anchor localnet --skip-build < <(sleep 3600) &
          timeout 120 bash -c 'until [ "$(solana block-height -u l 2>/dev/null || echo 0)" -ge 30 ]; do sleep 2; done'
          yarn test:unit

      - name: Run SDK tests
        env:
          ANCHOR_WALLET: ./test-keypair.json
        run: yarn workspace @thawgate/sdk run test 2>&1 | tee sdk_vitest.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-test-logs
          path: sdk_vitest.log
