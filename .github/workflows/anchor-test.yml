name: Anchor Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit bash runs steps with `-eo pipefail`, so `cmd | tee log` fails when cmd fails
defaults:
  run:
    shell: bash

jobs:
  anchor-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          # Same as local dev. There is no 3.0.15 release (the `stable` channel once served an untagged v3.0 build labelled 3.0.15)
          curl -sSfL https://release.anza.xyz/v3.0.14/install -o "$RUNNER_TEMP/solana-install.sh"
          sh "$RUNNER_TEMP/solana-install.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Install Anchor CLI
        run: |
          # anchor-cli pulls hidapi (solana-remote-wallet), which links the system libudev
          sudo apt-get update -y && sudo apt-get install -y libudev-dev pkg-config
          cargo install anchor-cli --version 0.32.2 --locked

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: commander@15 (via @solana/errors 6.x) requires >= 22.12; local dev runs 22.17
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate test keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json
          solana-keygen new --no-bip39-passphrase --outfile ./test-keypair.json
          solana config set --url localhost

      - name: Build programs
        run: anchor build

      - name: Run anchor tests
        run: anchor test 2>&1 | tee evidence/logs/anchor-test-ci.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-test-results
          path: evidence/logs/anchor-test-ci.txt
